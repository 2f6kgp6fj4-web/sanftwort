name: App prüfen und Android-Testversion bauen

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/app-check.yml"]
  workflow_dispatch:

concurrency:
  group: app-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typprüfung
        run: npx tsc --noEmit
      - name: JavaScript bündeln (iOS und Android)
        run: npx expo export --platform ios --platform android --output-dir dist-check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Native Android-Projekt erzeugen
        run: npx expo prebuild --platform android --no-install
      - name: Android-APK bauen
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: sanftwort-android-test
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
