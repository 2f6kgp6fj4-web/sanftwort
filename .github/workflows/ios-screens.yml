name: iPhone-Simulator – App durchklicken und Screenshots

on:
  workflow_dispatch:

jobs:
  screens:
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform ios --no-install
      - name: Pods
        working-directory: mobile/ios
        run: pod install --repo-update
      - name: Simulator wählen und starten
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]; p=[x for x in c if 'Pro Max' in x['name']] or c; print(p[-1]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl list devices | grep $UDID
          xcrun simctl boot $UDID
          xcrun simctl spawn $UDID defaults write .GlobalPreferences AppleLanguages -array de
          xcrun simctl spawn $UDID defaults write .GlobalPreferences AppleLocale de_DE
      - name: Bauen (Release, nur dieser Simulator)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Sanftwort.xcworkspace -scheme Sanftwort -configuration Release \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tail -5
      - name: Installieren
        run: |
          xcrun simctl shutdown $UDID || true
          xcrun simctl boot $UDID
          xcrun simctl status_bar $UDID override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install $UDID ios/build/Build/Products/Release-iphonesimulator/Sanftwort.app
      - name: Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          mkdir -p shots && cd shots
          maestro --device $UDID test ../.maestro/screens.yaml || (xcrun simctl io $UDID screenshot fehler.png; exit 1)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanftwort-screens
          path: mobile/shots
