name: iPhone-Version prüfen (Simulator-Build, ohne Signatur)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Native iOS-Projekt erzeugen
        run: npx expo prebuild --platform ios --no-install
      - name: Pods installieren
        working-directory: mobile/ios
        run: pod install --repo-update
      - name: Für den Simulator bauen (inkl. Teilen-Erweiterung)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Sanftwort.xcworkspace -scheme Sanftwort -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build | tail -60
