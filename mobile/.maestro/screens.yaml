appId: de.sanftwort.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Loslegen"
    timeout: 30000
- takeScreenshot: ${SHOTS}/01-start
- tapOn: "Ich bin einverstanden.*"
- tapOn: "Loslegen"
- extendedWaitUntil:
    visible: "Sanft formulieren"
    timeout: 15000
- tapOn: "Was du sagen willst"
- inputText: "Du hast SCHON WIEDER vergessen, den Müll rauszubringen. Immer bleibt alles an mir hängen!"
- hideKeyboard
- takeScreenshot: ${SHOTS}/02-eingabe
- tapOn: "Sanft formulieren"
- extendedWaitUntil:
    visible: "Klingt nicht nach mir.*"
    timeout: 60000
- takeScreenshot: ${SHOTS}/03-ergebnis
- scroll
- takeScreenshot: ${SHOTS}/04-ergebnis-unten
- scrollUntilVisible:
    element: "Ich hab was bekommen"
    direction: UP
- tapOn: "Ich hab was bekommen"
- tapOn: "Die Nachricht, die du bekommen hast"
- inputText: "Schön, dass du dich auch mal meldest. Ich hab den ganzen Tag allein mit den Kindern gemacht und du sitzt beim Afterwork."
- hideKeyboard
- tapOn: "Verstehen & antworten"
- extendedWaitUntil:
    visible: "Klingt nicht nach mir.*"
    timeout: 60000
- takeScreenshot: ${SHOTS}/05-bekommen
- scroll
- takeScreenshot: ${SHOTS}/06-bekommen-unten
- scrollUntilVisible:
    element: ".*von 5 frei.*"
    direction: UP
- tapOn: ".*von 5 frei.*"
- extendedWaitUntil:
    visible: "Sanftwort Plus"
    timeout: 10000
- takeScreenshot: ${SHOTS}/07-plus
