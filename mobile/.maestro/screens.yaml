appId: de.sanftwort.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Loslegen"
    timeout: 30000
- takeScreenshot: 01-start
- tapOn: "Ich bin einverstanden.*"
- tapOn: "Loslegen"
- extendedWaitUntil:
    visible: "Sanft formulieren"
    timeout: 15000
- tapOn: "Sag oder schreib.*"
- inputText: "Du hast SCHON WIEDER vergessen, den Müll rauszubringen. Immer bleibt alles an mir hängen!"
- hideKeyboard
- takeScreenshot: 02-eingabe
- tapOn: "Sanft formulieren"
- extendedWaitUntil:
    visible: "Klingt nicht nach mir.*"
    timeout: 60000
- takeScreenshot: 03-ergebnis
- scroll
- takeScreenshot: 04-ergebnis-unten
- scrollUntilVisible:
    element: "Ich hab was bekommen"
    direction: UP
- tapOn: "Ich hab was bekommen"
- tapOn: "Füg die Nachricht ein.*"
- inputText: "Schön, dass du dich auch mal meldest. Ich hab den ganzen Tag allein mit den Kindern gemacht und du sitzt beim Afterwork."
- hideKeyboard
- tapOn: "Verstehen & antworten"
- extendedWaitUntil:
    visible: "Klingt nicht nach mir.*"
    timeout: 60000
- takeScreenshot: 05-bekommen
- scroll
- takeScreenshot: 06-bekommen-unten
- scrollUntilVisible:
    element: ".* von 5 frei"
    direction: UP
- tapOn: ".* von 5 frei"
- extendedWaitUntil:
    visible: "Sanftwort Plus"
    timeout: 10000
- takeScreenshot: 07-plus
